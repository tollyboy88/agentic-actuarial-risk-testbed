[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-actuarial-testbed"
version = "0.1.0"
description = "Reproducible simulation of error propagation and scenario-conditioned operational risk capital in agentic actuarial workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic>=2.10",
  "PyYAML>=6",
  "scipy>=1.15",
  "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]
dashboard = ["fastapi>=0.116", "uvicorn[standard]>=0.35"]

[project.scripts]
aat-sim = "aat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
